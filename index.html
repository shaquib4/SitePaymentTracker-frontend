<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512x512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KE Tracker" />
    <meta name="application-name" content="KE Tracker" />
    <title>KE Payment Tracker - Enterprise Expense & Approval</title>
    <script>
      // Self-healing: if an outdated JS bundle or stylesheet fails to load (404), purge outdated caches and reload once
      window.addEventListener('error', function(e) {
        var target = e.target || e.srcElement;
        if (target && (target.tagName === 'SCRIPT' || (target.tagName === 'LINK' && target.rel === 'stylesheet'))) {
          if (!sessionStorage.getItem('recovered_from_asset_error')) {
            sessionStorage.setItem('recovered_from_asset_error', 'true');
            console.warn('App script or stylesheet failed to load, purging caches and recovering:', target.src || target.href);
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).then(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      }, true);

      // Clean up any stale legacy caches left by old sw.js
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var k = 0; k < names.length; k++) {
            if (names[k].indexOf('ke-payments-cache') !== -1) {
              caches.delete(names[k]);
            }
          }
        });
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
